openapi: 3.1.0
info:
  title: Dragon View API
  version: 0.1.0
  description: HTTP contract between the independently deployed Angular client and Express API.
servers:
  - url: http://localhost:3000/api
security:
  - bearerAuth: []
paths:
  /inventory:
    get:
      summary: List active FIFO inventory lots
      parameters:
        - in: query
          name: grade
          schema:
            type: string
            enum: [A, B, C]
        - in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: Active inventory lots ordered oldest first
  /inventory/harvests:
    post:
      summary: Register a harvest batch with one or more size-and-grade items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterHarvest'
      responses:
        '201':
          description: Harvest registered
  /sales/complete:
    post:
      summary: Complete a paid sale and deduct matching inventory by FIFO piece quantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteSale'
      responses:
        '201':
          description: Sale completed
        '409':
          description: Insufficient matching inventory or missing price
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    FruitSize:
      type: string
      enum: [EXTRA_SMALL, SMALL, MEDIUM, LARGE, JUMBO]
    FruitGrade:
      type: string
      enum: [A, B, C]
    RegisterHarvest:
      type: object
      required: [batchNumber, harvestDate, items]
      properties:
        batchNumber:
          type: string
        harvestDate:
          type: string
          format: date
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [size, grade, pieces]
            properties:
              size:
                $ref: '#/components/schemas/FruitSize'
              grade:
                $ref: '#/components/schemas/FruitGrade'
              pieces:
                type: integer
                minimum: 1
    CompleteSale:
      type: object
      required: [customer, items, payment]
      properties:
        customer:
          type: object
          required: [name, address, contactNumber, emailAddress]
          properties:
            name: { type: string }
            address: { type: string }
            contactNumber: { type: string }
            emailAddress: { type: string, format: email }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [size, grade, pieces, totalWeightKilograms]
            properties:
              size:
                $ref: '#/components/schemas/FruitSize'
              grade:
                $ref: '#/components/schemas/FruitGrade'
              pieces:
                type: integer
                minimum: 1
              totalWeightKilograms:
                type: string
                pattern: '^\d+(\.\d{1,3})?$'
        payment:
          type: object
          required: [method, amountPaid]
          properties:
            method:
              type: string
              enum: [CASH, GCASH, MAYA, OTHER_E_WALLET, BANK_TRANSFER]
            amountPaid:
              type: string
            reference:
              type: string
            otherEWalletProvider:
              type: string
